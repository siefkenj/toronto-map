name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight production deploy to finish; collapse queued runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: toronto-map-ai

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: toronto-map-ai/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The tile pre-render rasterizes the poster in headless Chromium.
      - name: Install Chromium for tile pre-rendering
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./toronto-map-ai/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
